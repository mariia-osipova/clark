<!DOCTYPE html>
<html lang="es">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="utf-8" />
    <title>Clark — Catálogo</title>
    <link rel="icon" type="image/png" href="https://c.animaapp.com/Y5zUzjcR/img/group-23@6x.png" />
    <link rel="stylesheet" href="globals.css" />
    <link rel="stylesheet" href="chat-styleguide.css" />
    <link rel="stylesheet" href="chat-style.css" />
    <link rel="stylesheet" href="catalog.css" />
  </head>
  <body>
    <div class="desktop">

      <!-- Navigation -->
      <nav class="nav-chat" aria-label="Main navigation">
        <a href="index.html" class="nav-home" aria-label="Home">Home</a>
        <div class="find-bar">
          <input class="find-bar__input" id="find-bar-input" type="search" placeholder="Buscar productos..." autocomplete="off" aria-label="Buscar productos" />
          <button class="find-bar__btn" id="find-bar-btn" aria-label="Buscar">
            <svg width="15" height="15" viewBox="0 0 15 15" fill="none" aria-hidden="true"><circle cx="6.5" cy="6.5" r="5" stroke="currentColor" stroke-width="1.5"/><path d="M10.5 10.5L13.5 13.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          </button>
        </div>
        <a href="catalog.html" class="nav-icon-btn nav-icon-btn--active" aria-label="Catálogo">
          <svg width="19" height="19" viewBox="0 0 19 19" fill="none" aria-hidden="true"><rect x="1" y="1" width="7" height="7" rx="1" stroke="currentColor" stroke-width="1.5"/><rect x="11" y="1" width="7" height="7" rx="1" stroke="currentColor" stroke-width="1.5"/><rect x="1" y="11" width="7" height="7" rx="1" stroke="currentColor" stroke-width="1.5"/><rect x="11" y="11" width="7" height="7" rx="1" stroke="currentColor" stroke-width="1.5"/></svg>
        </a>
        <button class="nav-icon-btn" type="button" aria-label="Chat" onclick="location.href='chat.html'">
          <img class="img" src="https://c.animaapp.com/ZM2jsSkD/img/chat-icon-1@2x.png" alt="" aria-hidden="true" />
        </button>
        <button class="nav-icon-btn" type="button" aria-label="Perfil">
          <img class="profile-icon" src="https://c.animaapp.com/ZM2jsSkD/img/profile-icon@2x.png" alt="" aria-hidden="true" />
        </button>
        <button class="nav-icon-btn" type="button" aria-label="Favoritos">
          <img class="img" src="https://c.animaapp.com/ZM2jsSkD/img/icon-of-favorites@2x.png" alt="" aria-hidden="true" />
        </button>
        <button class="nav-cart-btn" id="nav-cart-btn" aria-label="Ver carrito">
          <img class="cart-icon" src="https://c.animaapp.com/ZM2jsSkD/img/cart-icon@2x.png" alt="" aria-hidden="true" />
          <span class="cart-badge hidden" id="cart-badge">0</span>
        </button>
      </nav>

      <!-- Page body -->
      <main class="catalog-page">

        <!-- Sidebar: categories -->
        <aside class="catalog-sidebar">
          <p class="catalog-sidebar__label">Categorías</p>
          <ul class="catalog-categories" id="catalog-categories">
            <li><button class="cat-btn cat-btn--active" data-cat="">Todos</button></li>
          </ul>
        </aside>

        <!-- Main area -->
        <div class="catalog-main">
          <div class="catalog-toolbar">
            <p class="catalog-count" id="catalog-count">Cargando...</p>
          </div>
          <div class="catalog-grid" id="catalog-grid">
            <p class="catalog-loading" id="catalog-loading">Cargando productos...</p>
          </div>
        </div>

      </main>

      <!-- Cart panel -->
      <aside class="cart-panel hidden" id="cart-panel" aria-label="Carrito">
        <div class="cart-panel__header">
          <span class="cart-panel__title">Tu carrito</span>
          <button class="cart-panel__close" id="cart-close" aria-label="Cerrar carrito">✕</button>
        </div>
        <div class="cart-items" id="cart-items">
          <p class="cart-empty hidden" id="cart-empty-msg">Tu carrito está vacío.</p>
        </div>
        <div class="cart-footer hidden" id="cart-footer">
          <div class="cart-total">Total: <span id="cart-total">$0.00</span></div>
          <button class="cart-checkout" id="btn-checkout">Confirmar pedido</button>
        </div>
      </aside>

    </div>
    <script src="catalog-app.js"></script>
  </body>
</html>
