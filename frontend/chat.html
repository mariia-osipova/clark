<!DOCTYPE html>
<html lang="es">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="utf-8" />
    <title>Clark - Chat</title>
    <link rel="icon" type="image/png" href="https://c.animaapp.com/Y5zUzjcR/img/group-23@6x.png" />
    <link rel="stylesheet" href="globals.css" />
    <link rel="stylesheet" href="chat-styleguide.css" />
    <link rel="stylesheet" href="chat-style.css" />
  </head>
  <body>
    <div class="desktop">

      <!-- Navigation -->
      <nav class="nav-chat" aria-label="Main navigation">
        <a href="index.html" class="nav-home" aria-label="Home">Home</a>
        <div class="find-bar">
          <input class="find-bar__input" id="find-bar-input" type="search" placeholder="Buscar productos..." autocomplete="off" aria-label="Buscar productos" />
          <button class="find-bar__btn" id="find-bar-btn" aria-label="Buscar">
            <svg width="15" height="15" viewBox="0 0 15 15" fill="none" aria-hidden="true"><circle cx="6.5" cy="6.5" r="5" stroke="currentColor" stroke-width="1.5"/><path d="M10.5 10.5L13.5 13.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          </button>
        </div>
        <div class="nav-icon-group">
          <a href="catalog.html" class="nav-icon-btn" aria-label="Ver catálogo">
            <img class="catalog-nav-icon" src="pics/Group 29.png" alt="" aria-hidden="true" />
          </a>
          <button class="nav-icon-btn" type="button" aria-label="Chat">
            <img class="img" src="https://c.animaapp.com/ZM2jsSkD/img/chat-icon-1@2x.png" alt="" aria-hidden="true" />
          </button>
          <button class="nav-cart-btn" id="nav-cart-btn" aria-label="Ver carrito">
            <img class="cart-icon" src="https://c.animaapp.com/ZM2jsSkD/img/cart-icon@2x.png" alt="" aria-hidden="true" />
            <span class="cart-badge hidden" id="cart-badge">0</span>
          </button>
          <a href="contacto.html" class="nav-contact">Contact</a>
        </div>
      </nav>

      <!-- Chat area -->
      <main class="main">
        <div class="chat-layout">

          <!-- Chat column -->
          <div class="chat-column">
            <!-- Thread -->
            <div class="chat-thread-wrapper">
              <div class="chat-empty-state" id="chat-empty">
                <h1 class="heading">Hola, Jaime 👋</h1>
                <div class="button-row" id="demo-chips">
                  <button class="button-primary-like" data-msg="Cargá mi perfil desayuno">📦 Cargar desayuno</button>
                  <button class="button-primary-like" data-msg="Cargá mi perfil despensa">🗂 Cargar despensa</button>
                  <button class="button-primary-like" data-msg="Generá mi canasta mensual">📅 Canasta mensual</button>
                </div>
              </div>
              <div class="chat-thread" id="chat-thread"></div>
            </div>

            <!-- Input bar -->
            <div class="chat-input-bar">
              <button class="chat-input-icon-btn" id="btn-mic" title="Grabar mensaje de voz" aria-label="Grabar mensaje de voz">
                <img src="pics/microf.png" alt="" class="chat-icon-img" />
              </button>
              <button class="chat-input-icon-btn" id="btn-image" title="Subir foto o lista manuscrita" aria-label="Subir imagen">
                <img src="pics/cam.png" alt="" class="chat-icon-img" />
              </button>
              <input type="file" id="image-file-input" accept="image/jpeg,image/png,image/gif,image/webp" style="display:none" aria-hidden="true" />
              <label for="chat-input" class="sr-only">Escribe tu pedido</label>
              <input
                id="chat-input"
                class="chat-input"
                type="text"
                placeholder="Escribe, hablá o subí una foto..."
                autocomplete="off"
              />
              <button class="chat-submit" id="btn-send" type="button" aria-label="Enviar">
                <img class="chat-submit-icon" src="pics/Vector12.png" alt="Enviar" />
              </button>
            </div>
          </div>

          <!-- Cart panel -->
          <aside class="cart-panel hidden" id="cart-panel" aria-label="Carrito">
            <div class="cart-panel__header">
              <span class="cart-panel__title">Tu carrito</span>
              <button class="cart-panel__close" id="cart-close" aria-label="Cerrar carrito">✕</button>
            </div>
            <div class="cart-items" id="cart-items">
              <p class="cart-empty hidden" id="cart-empty-msg">Tu carrito está vacío.</p>
            </div>
            <div class="cart-footer hidden" id="cart-footer">
              <div class="cart-total">Total: <span id="cart-total">$0.00</span></div>
              <button class="cart-checkout button-primary-like" id="btn-checkout">Confirmar pedido</button>
            </div>
          </aside>

        </div>
      </main>

<!-- Clarification modal -->
      <div class="modal hidden" id="clarification-modal">
        <div class="modal__overlay"></div>
        <div class="modal__box" role="dialog" aria-modal="true" aria-labelledby="modal-question">
          <h2 class="modal__question" id="modal-question"></h2>
          <form id="clarification-form">
            <fieldset class="modal__fieldset">
              <legend class="sr-only">Opciones de aclaración</legend>
              <div class="modal__options" id="modal-options"></div>
            </fieldset>
            <p class="modal__error hidden" id="modal-error" aria-live="polite"></p>
            <div class="modal__actions">
              <button class="modal-btn modal-btn--primary button-primary-like" id="modal-confirm" type="submit" disabled>Confirmar</button>
              <button class="modal-btn modal-btn--secondary" id="modal-cancel" type="button">Cancelar</button>
            </div>
          </form>
        </div>
      </div>

    </div>
    <script src="chat-app.js"></script>
  </body>
</html>
